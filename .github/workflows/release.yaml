name: Release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Source Tag to build from (optional: leave blank to use the "Use workflow from" Tag/Branch selector above, or type any tag)'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'Official Release Tag to publish (e.g. v0.2.0)'
        required: true
        type: string
        default: 'v0.2.0'
      prerelease:
        description: 'Mark as Pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  inspect:
    name: "Stage 1: Inspect & Prepare Release"
    runs-on: ubuntu-24.04
    outputs:
      latest_release: ${{ steps.check_git.outputs.latest_release }}
      source_tag: ${{ steps.check_git.outputs.source_tag }}
      target_tag: ${{ steps.check_git.outputs.target_tag }}
      source_sha: ${{ steps.check_git.outputs.source_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Inspect Git State & Tags
        id: check_git
        run: |
          git fetch --tags --force

          # 1. Detect latest official semver release tag (excluding CI build tags)
          LATEST_RELEASE=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v 'build' | sort -V | tail -n 1)
          if [ -z "$LATEST_RELEASE" ]; then
            LATEST_RELEASE=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          fi
          if [ -z "$LATEST_RELEASE" ]; then
            LATEST_RELEASE="None"
          fi
          echo "latest_release=$LATEST_RELEASE" >> "$GITHUB_OUTPUT"

          # 2. Resolve Source Tag: manual input takes precedence, otherwise fallback to the selected ref in "Use workflow from"
          INPUT_TAG="${{ inputs.source_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            SOURCE_TAG="$INPUT_TAG"
          else
            SOURCE_TAG="${{ github.ref_name }}"
          fi

          if ! git rev-parse "refs/tags/${SOURCE_TAG}" >/dev/null 2>&1 && ! git rev-parse "${SOURCE_TAG}" >/dev/null 2>&1; then
            echo "::error::Source ref/tag '${SOURCE_TAG}' does not exist on remote or locally."
            echo "Available tags:"
            git tag -l --sort=-creatordate | head -n 10
            exit 1
          fi
          SOURCE_SHA=$(git rev-parse "${SOURCE_TAG}^{commit}")
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          # 3. Format Target Release Tag
          RAW_TAG="${{ inputs.release_tag }}"
          if [[ ! "$RAW_TAG" =~ ^v ]]; then
            TARGET_TAG="v${RAW_TAG}"
          else
            TARGET_TAG="${RAW_TAG}"
          fi
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

          RECENT_TAGS=$(git tag -l --sort=-creatordate | head -n 5 | paste -sd ", " -)

          echo "=========================================="
          echo "📌 Current Latest Official Release: $LATEST_RELEASE"
          echo "🏷️ Recent Git Tags on Remote:       $RECENT_TAGS"
          echo "🔍 Source Ref Selected:             $SOURCE_TAG (${SOURCE_SHA:0:7})"
          echo "🎯 Official Release To Publish:     $TARGET_TAG"
          echo "=========================================="

  publish:
    name: "Stage 2: GoReleaser, Homebrew, Scoop & Linux Packages"
    needs: [inspect]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare and Tag Target Commit
        run: |
          git fetch --tags --force
          SOURCE_TAG="${{ needs.inspect.outputs.source_tag }}"
          TARGET_TAG="${{ needs.inspect.outputs.target_tag }}"
          SOURCE_SHA="${{ needs.inspect.outputs.source_sha }}"
          CLEAN_VER="${TARGET_TAG#v}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Checking out source commit $SOURCE_SHA ($SOURCE_TAG)..."
          git checkout "$SOURCE_SHA"

          # Check if target release version is higher than current version in cmd/version.go
          CURRENT_CODE_VER=$(grep -E '^\s*Version\s*=\s*' cmd/version.go | awk -F'"' '{print $2}')
          echo "Current version in cmd/version.go: '$CURRENT_CODE_VER'"
          echo "Target release version:            '$CLEAN_VER'"

          NEEDS_BUMP=false
          if [ "$CURRENT_CODE_VER" = "dev" ] || [ -z "$CURRENT_CODE_VER" ]; then
            NEEDS_BUMP=true
          elif [ "$CURRENT_CODE_VER" != "$CLEAN_VER" ]; then
            HIGHER_VER=$(printf '%s\n%s\n' "$CURRENT_CODE_VER" "$CLEAN_VER" | sort -V | tail -n 1)
            if [ "$HIGHER_VER" = "$CLEAN_VER" ]; then
              NEEDS_BUMP=true
            fi
          fi

          if [ "$NEEDS_BUMP" = "true" ]; then
            echo "Target release v${CLEAN_VER} is higher than code version '${CURRENT_CODE_VER}'. Updating cmd/version.go..."
            sed -i.bak -E "s/(Version\s*=\s*\")[^\"]+(\")/\1${CLEAN_VER}\2/" cmd/version.go && rm -f cmd/version.go.bak
            git add cmd/version.go
            git commit -m "chore(release): bump version to v${CLEAN_VER} in code [skip ci]"

            echo "Pushing updated version commit to origin main..."
            git push origin HEAD:main

            # Update SOURCE_SHA so tag points to this new commit
            SOURCE_SHA=$(git rev-parse HEAD)
            echo "Target release commit updated to: $SOURCE_SHA"
          else
            echo "Version in code ('$CURRENT_CODE_VER') is already >= target release ('$CLEAN_VER'). No bump commit needed."
          fi

          # If target tag already exists, ensure it points to the requested commit
          if git rev-parse "refs/tags/${TARGET_TAG}" >/dev/null 2>&1; then
            EXISTING_TAG_SHA=$(git rev-parse "${TARGET_TAG}^{commit}")
            if [ "$EXISTING_TAG_SHA" != "$SOURCE_SHA" ]; then
              echo "::warning::Tag $TARGET_TAG already points to a different commit ($EXISTING_TAG_SHA vs $SOURCE_SHA). Re-tagging..."
              git tag -d "$TARGET_TAG"
              git push origin ":refs/tags/${TARGET_TAG}" || true
              git tag -a "$TARGET_TAG" -m "Production release $TARGET_TAG from $SOURCE_TAG"
              git push origin "$TARGET_TAG"
            else
              echo "Tag $TARGET_TAG already points to $SOURCE_SHA"
            fi
          else
            echo "Creating and pushing new release tag $TARGET_TAG at $SOURCE_SHA..."
            git tag -a "$TARGET_TAG" -m "Production release $TARGET_TAG from $SOURCE_TAG"
            git push origin "$TARGET_TAG"
          fi

          # Checkout the exact release tag for GoReleaser
          git checkout "$TARGET_TAG"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ inputs.prerelease && '--prerelease' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Render Release Step Summary
        if: always()
        run: |
          TARGET_TAG="${{ needs.inspect.outputs.target_tag }}"
          SOURCE_TAG="${{ needs.inspect.outputs.source_tag }}"
          SOURCE_SHA="${{ needs.inspect.outputs.source_sha }}"
          LATEST_RELEASE="${{ needs.inspect.outputs.latest_release }}"
          SHORT_SHA="${SOURCE_SHA:0:7}"
          CLEAN_VER="${TARGET_TAG#v}"

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          # 🎣 Angler CLI — Production Release Summary

          ### 🏷️ Release Metadata
          | Parameter | Value |
          |---|---|
          | **Official Release Tag** | \`$TARGET_TAG\` |
          | **Built From Tag / Ref** | \`$SOURCE_TAG\` |
          | **Previous Official Release** | \`$LATEST_RELEASE\` |
          | **Target Commit** | [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${SOURCE_SHA}) |
          | **Triggered By** | \`${{ github.actor }}\` via manual dispatch |
          | **Pre-release** | \`${{ inputs.prerelease }}\` |
          | **GitHub Release** | [View Release on GitHub](${{ github.server_url }}/${{ github.repository }}/releases/tag/${TARGET_TAG}) |

          ### 📦 Published Artifacts & Distribution Channels
          | Platform | Channel / Package | Artifact |
          |---|---|---|
          | **macOS / Linux** | **Homebrew Tap** | [\`Lake-of-Tears/homebrew-tap\`](https://github.com/Lake-of-Tears/homebrew-tap) |
          | **Windows** | **Scoop Bucket** | [\`Lake-of-Tears/scoop-bucket\`](https://github.com/Lake-of-Tears/scoop-bucket) |
          | **Windows** | **Chocolatey** | [\`angler\` package](https://community.chocolatey.org/packages/angler) |
          | **Debian / Ubuntu** | **Debian Package** | \`angler_${CLEAN_VER}_linux_amd64.deb\` / \`arm64.deb\` |
          | **RedHat / Fedora** | **RPM Package** | \`angler_${CLEAN_VER}_linux_amd64.rpm\` / \`arm64.rpm\` |
          | **macOS Binaries** | Tarball | \`angler_${CLEAN_VER}_darwin_arm64.tar.gz\` / \`amd64.tar.gz\` |
          | **Linux Binaries** | Tarball | \`angler_${CLEAN_VER}_linux_arm64.tar.gz\` / \`amd64.tar.gz\` |
          | **Windows Binaries** | Zip Archive / NuGet | \`angler_${CLEAN_VER}_windows_amd64.zip\` / \`arm64.zip\` / \`angler.${CLEAN_VER}.nupkg\` |
          | **Checksums** | SHA-256 | \`checksums.txt\` |

          ### 🚀 How to Install or Upgrade

          #### macOS & Linux (Homebrew)
          \`\`\`bash
          brew update
          brew upgrade angler
          # Or fresh install:
          brew install Lake-of-Tears/tap/angler
          \`\`\`

          #### Windows (Scoop)
          \`\`\`powershell
          scoop bucket add lake-of-tears https://github.com/Lake-of-Tears/scoop-bucket
          scoop install angler
          \`\`\`

          #### Windows (Chocolatey)
          \`\`\`powershell
          choco install angler
          # Or upgrade:
          choco upgrade angler
          \`\`\`

          #### Debian / Ubuntu (.deb)
          \`\`\`bash
          curl -sLO "https://github.com/Lake-of-Tears/angler/releases/download/${TARGET_TAG}/angler_${CLEAN_VER}_linux_amd64.deb"
          sudo dpkg -i angler_${CLEAN_VER}_linux_amd64.deb
          \`\`\`

          #### RedHat / Fedora (.rpm)
          \`\`\`bash
          sudo rpm -i "https://github.com/Lake-of-Tears/angler/releases/download/${TARGET_TAG}/angler_${CLEAN_VER}_linux_amd64.rpm"
          \`\`\`
          EOF

  chocolatey:
    name: "Stage 3: Chocolatey Package & Publish"
    needs: [inspect, publish]
    runs-on: windows-latest
    steps:
      - name: Check Chocolatey Token
        id: check_token
        shell: bash
        env:
          CHOCO_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if [ -z "$CHOCO_KEY" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "CHOCOLATEY_API_KEY secret not configured. 'choco push' will be skipped."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "CHOCOLATEY_API_KEY secret is configured."
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.inspect.outputs.target_tag }}

      - name: Download Windows Release Archive & Extract Checksum
        shell: bash
        run: |
          TARGET_TAG="${{ needs.inspect.outputs.target_tag }}"
          CLEAN_VER="${TARGET_TAG#v}"

          # Fetch checksums.txt from newly published release
          curl -sSL "https://github.com/Lake-of-Tears/angler/releases/download/${TARGET_TAG}/checksums.txt" -o checksums.txt
          SHA256_64=$(grep "angler_${CLEAN_VER}_windows_amd64.zip" checksums.txt | awk '{print $1}')

          if [ -z "$SHA256_64" ]; then
            echo "::error::Could not find SHA-256 checksum for angler_${CLEAN_VER}_windows_amd64.zip in checksums.txt"
            exit 1
          fi

          echo "sha256_64=$SHA256_64" >> "$GITHUB_ENV"
          echo "clean_ver=$CLEAN_VER" >> "$GITHUB_ENV"
          echo "Windows x64 SHA-256: $SHA256_64"

      - name: Generate Chocolatey Manifests
        shell: pwsh
        run: |
          $ver = $env:clean_ver
          $tag = "${{ needs.inspect.outputs.target_tag }}"
          $sha64 = $env:sha256_64

          New-Item -ItemType Directory -Force -Path "choco\tools" | Out-Null

          # CPR0006: Embed repository LICENSE
          Copy-Item -Path "LICENSE" -Destination "choco\tools\LICENSE.txt" -Force

          # CPR0005: Generate VERIFICATION.txt for remote binary verification
          @"
          VERIFICATION
          Verification is intended to assist the Chocolatey moderators and community
          in verifying that this package's contents are trustworthy and untampered with.

          Package Name: angler
          Version: $ver

          1. Upstream Official Release Archive:
             URL: https://github.com/Lake-of-Tears/angler/releases/download/$tag/angler_${ver}_windows_amd64.zip

          2. Checksum Verification Source:
             Official SHA-256 checksums are published in the release checksums file:
             URL: https://github.com/Lake-of-Tears/angler/releases/download/$tag/checksums.txt

          3. Expected SHA-256 Hash:
             File: angler_${ver}_windows_amd64.zip
             SHA-256: $sha64

          4. Integrity Verification Instructions:
             To independently verify the downloaded binary archive matches upstream:

             PowerShell:
               Invoke-WebRequest -Uri "https://github.com/Lake-of-Tears/angler/releases/download/$tag/angler_${ver}_windows_amd64.zip" -OutFile "angler_${ver}_windows_amd64.zip"
               (Get-FileHash .\angler_${ver}_windows_amd64.zip -Algorithm SHA256).Hash -eq "$sha64"

             Command Prompt (cmd.exe):
               certutil -hashfile angler_${ver}_windows_amd64.zip SHA256
          "@ | Set-Content -Path "choco\tools\VERIFICATION.txt"

          # Generate nuspec with full CPV metadata compliance
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>angler</id>
              <version>$ver</version>
              <title>Angler CLI (Lake of Tears)</title>
              <authors>Lake of Tears Team</authors>
              <owners>thelakeoftears</owners>
              <projectUrl>https://thelakeoftears.com</projectUrl>
              <projectSourceUrl>https://github.com/Lake-of-Tears/angler</projectSourceUrl>
              <packageSourceUrl>https://github.com/Lake-of-Tears/angler</packageSourceUrl>
              <docsUrl>https://github.com/Lake-of-Tears/angler#readme</docsUrl>
              <bugTrackerUrl>https://github.com/Lake-of-Tears/angler/issues</bugTrackerUrl>
              <licenseUrl>https://github.com/Lake-of-Tears/angler/blob/main/LICENSE</licenseUrl>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <description>The official CLI for Lake of Tears — cast queries, launch clusters, inspect catalogs, and reel in data. Built for modern high-performance cloud data lakes with DuckDB over S3.</description>
              <summary>Lake of Tears CLI: query DuckDB over S3, manage clusters, and execute AI queries.</summary>
              <tags>lake-of-tears angler datalakehouse duckdb s3 cli</tags>
              <releaseNotes>https://github.com/Lake-of-Tears/angler/releases/tag/$tag</releaseNotes>
            </metadata>
            <files>
              <file src="tools\**" target="tools" />
            </files>
          </package>
          "@ | Set-Content -Path "choco\angler.nuspec"

          # Generate chocolateyinstall.ps1 with 64-bit architecture guard
          @"
          `$ErrorActionPreference = 'Stop'

          if (-not (Get-ProcessorBits 64)) {
            throw "The angler package is only available for 64-bit (x64) Windows architectures."
          }

          `$toolsDir = "`$(Split-Path -parent `$MyInvocation.MyCommand.Definition)"
          `$url64 = "https://github.com/Lake-of-Tears/angler/releases/download/$tag/angler_${ver}_windows_amd64.zip"

          `$packageArgs = @{
            packageName   = 'angler'
            unzipLocation = `$toolsDir
            url64bit      = `$url64
            checksum64    = '$sha64'
            checksumType64= 'sha256'
          }

          Install-ChocolateyZipPackage @packageArgs
          "@ | Set-Content -Path "choco\tools\chocolateyinstall.ps1"

      - name: Pack Chocolatey Package
        shell: pwsh
        run: |
          Set-Location choco
          choco pack angler.nuspec
          if (-not (Test-Path "angler.$($env:clean_ver).nupkg")) {
            throw "Expected package angler.$($env:clean_ver).nupkg was not generated."
          }

      - name: Upload Chocolatey Package to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chocolatey-package-${{ env.clean_ver }}
          path: choco/angler.*.nupkg
          if-no-files-found: error

      - name: Upload Chocolatey Package to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ needs.inspect.outputs.target_tag }}"
          echo "Uploading Chocolatey package to GitHub Release ${TARGET_TAG}..."
          gh release upload "${TARGET_TAG}" choco/angler.*.nupkg --clobber

      - name: Push to Chocolatey Community Repository
        if: steps.check_token.outputs.has_token == 'true' && !inputs.prerelease
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          Set-Location choco
          choco push "angler.$($env:clean_ver).nupkg" --api-key $env:CHOCOLATEY_API_KEY --source https://push.chocolatey.org/

      - name: Render Chocolatey Step Summary
        if: always()
        shell: pwsh
        run: |
          $ver = $env:clean_ver
          $tag = "${{ needs.inspect.outputs.target_tag }}"
          $sha64 = $env:sha256_64
          $hasToken = "${{ steps.check_token.outputs.has_token }}"
          $isPrerelease = "${{ inputs.prerelease }}"

          if ($hasToken -eq 'true' -and $isPrerelease -ne 'true') {
            $pushStatus = "✅ Published to [Chocolatey Community Repository](https://community.chocolatey.org/packages/angler)"
          } elseif ($isPrerelease -eq 'true') {
            $pushStatus = "⏭️ Skipped push (pre-release run: prerelease = true)"
          } else {
            $pushStatus = "⚠️ Skipped push (CHOCOLATEY_API_KEY secret not configured)"
          }

          @"

          ## 🍫 Chocolatey Packaging & Moderation (CPR) Summary

          | Parameter | Value |
          |---|---|
          | **Package ID** | \`angler\` |
          | **Version** | \`$ver\` |
          | **Architecture** | 64-bit Windows (x64) |
          | **Archive Source** | [\`angler_${ver}_windows_amd64.zip\`](https://github.com/Lake-of-Tears/angler/releases/download/$tag/angler_${ver}_windows_amd64.zip) |
          | **SHA-256 Checksum** | \`$sha64\` |
          | **CPR0005 (VERIFICATION.txt)** | Embedded in \`tools/VERIFICATION.txt\` |
          | **CPR0006 (LICENSE.txt)** | Embedded in \`tools/LICENSE.txt\` |
          | **Publish Status** | $pushStatus |

          ### 📦 Installation
          \`\`\`powershell
          # Install from Chocolatey Community Repository:
          choco install angler --version $ver

          # Or install from local .nupkg file:
          choco install angler -s .
          \`\`\`
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
