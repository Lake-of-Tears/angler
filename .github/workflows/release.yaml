name: Release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Source Tag to build from (optional: leave blank to use the "Use workflow from" Tag/Branch selector above, or type any tag)'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'Official Release Tag to publish (e.g. v0.2.0)'
        required: true
        type: string
        default: 'v0.2.0'
      prerelease:
        description: 'Mark as Pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  inspect:
    name: "Stage 1: Inspect & Prepare Release"
    runs-on: ubuntu-24.04
    outputs:
      latest_release: ${{ steps.check_git.outputs.latest_release }}
      source_tag: ${{ steps.check_git.outputs.source_tag }}
      target_tag: ${{ steps.check_git.outputs.target_tag }}
      source_sha: ${{ steps.check_git.outputs.source_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Inspect Git State & Tags
        id: check_git
        run: |
          git fetch --tags --force

          # 1. Detect latest official semver release tag (excluding CI build tags)
          LATEST_RELEASE=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v 'build' | sort -V | tail -n 1)
          if [ -z "$LATEST_RELEASE" ]; then
            LATEST_RELEASE=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          fi
          if [ -z "$LATEST_RELEASE" ]; then
            LATEST_RELEASE="None"
          fi
          echo "latest_release=$LATEST_RELEASE" >> "$GITHUB_OUTPUT"

          # 2. Resolve Source Tag: manual input takes precedence, otherwise fallback to the selected ref in "Use workflow from"
          INPUT_TAG="${{ inputs.source_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            SOURCE_TAG="$INPUT_TAG"
          else
            SOURCE_TAG="${{ github.ref_name }}"
          fi

          if ! git rev-parse "refs/tags/${SOURCE_TAG}" >/dev/null 2>&1 && ! git rev-parse "${SOURCE_TAG}" >/dev/null 2>&1; then
            echo "::error::Source ref/tag '${SOURCE_TAG}' does not exist on remote or locally."
            echo "Available tags:"
            git tag -l --sort=-creatordate | head -n 10
            exit 1
          fi
          SOURCE_SHA=$(git rev-parse "${SOURCE_TAG}^{commit}")
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          # 3. Format Target Release Tag
          RAW_TAG="${{ inputs.release_tag }}"
          if [[ ! "$RAW_TAG" =~ ^v ]]; then
            TARGET_TAG="v${RAW_TAG}"
          else
            TARGET_TAG="${RAW_TAG}"
          fi
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

          RECENT_TAGS=$(git tag -l --sort=-creatordate | head -n 5 | paste -sd ", " -)

          echo "=========================================="
          echo "📌 Current Latest Official Release: $LATEST_RELEASE"
          echo "🏷️ Recent Git Tags on Remote:       $RECENT_TAGS"
          echo "🔍 Source Ref Selected:             $SOURCE_TAG (${SOURCE_SHA:0:7})"
          echo "🎯 Official Release To Publish:     $TARGET_TAG"
          echo "=========================================="

  publish:
    name: "Stage 2: GoReleaser, Homebrew, Scoop & Linux Packages"
    needs: [inspect]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare and Tag Target Commit
        run: |
          git fetch --tags --force
          SOURCE_TAG="${{ needs.inspect.outputs.source_tag }}"
          TARGET_TAG="${{ needs.inspect.outputs.target_tag }}"
          SOURCE_SHA="${{ needs.inspect.outputs.source_sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Checking out source commit $SOURCE_SHA ($SOURCE_TAG)..."
          git checkout "$SOURCE_SHA"

          # If target tag already exists, ensure it points to the requested commit
          if git rev-parse "refs/tags/${TARGET_TAG}" >/dev/null 2>&1; then
            EXISTING_TAG_SHA=$(git rev-parse "${TARGET_TAG}^{commit}")
            if [ "$EXISTING_TAG_SHA" != "$SOURCE_SHA" ]; then
              echo "::warning::Tag $TARGET_TAG already points to a different commit ($EXISTING_TAG_SHA vs $SOURCE_SHA). Re-tagging..."
              git tag -d "$TARGET_TAG"
              git push origin ":refs/tags/${TARGET_TAG}" || true
              git tag -a "$TARGET_TAG" -m "Production release $TARGET_TAG from $SOURCE_TAG"
              git push origin "$TARGET_TAG"
            else
              echo "Tag $TARGET_TAG already points to $SOURCE_SHA"
            fi
          else
            echo "Creating and pushing new release tag $TARGET_TAG at $SOURCE_SHA..."
            git tag -a "$TARGET_TAG" -m "Production release $TARGET_TAG from $SOURCE_TAG"
            git push origin "$TARGET_TAG"
          fi

          # Checkout the exact release tag for GoReleaser
          git checkout "$TARGET_TAG"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ inputs.prerelease && '--prerelease' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Render Release Step Summary
        if: always()
        run: |
          TARGET_TAG="${{ needs.inspect.outputs.target_tag }}"
          SOURCE_TAG="${{ needs.inspect.outputs.source_tag }}"
          SOURCE_SHA="${{ needs.inspect.outputs.source_sha }}"
          LATEST_RELEASE="${{ needs.inspect.outputs.latest_release }}"
          SHORT_SHA="${SOURCE_SHA:0:7}"
          CLEAN_VER="${TARGET_TAG#v}"

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          # 🎣 Angler CLI — Production Release Summary

          ### 🏷️ Release Metadata
          | Parameter | Value |
          |---|---|
          | **Official Release Tag** | \`$TARGET_TAG\` |
          | **Built From Tag / Ref** | \`$SOURCE_TAG\` |
          | **Previous Official Release** | \`$LATEST_RELEASE\` |
          | **Target Commit** | [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${SOURCE_SHA}) |
          | **Triggered By** | \`${{ github.actor }}\` via manual dispatch |
          | **Pre-release** | \`${{ inputs.prerelease }}\` |
          | **GitHub Release** | [View Release on GitHub](${{ github.server_url }}/${{ github.repository }}/releases/tag/${TARGET_TAG}) |

          ### 📦 Published Artifacts & Distribution Channels
          | Platform | Channel / Package | Artifact |
          |---|---|---|
          | **macOS / Linux** | **Homebrew Tap** | [\`Lake-of-Tears/homebrew-tap\`](https://github.com/Lake-of-Tears/homebrew-tap) |
          | **Windows** | **Scoop Bucket** | [\`Lake-of-Tears/scoop-bucket\`](https://github.com/Lake-of-Tears/scoop-bucket) |
          | **Debian / Ubuntu** | **Debian Package** | \`angler_${CLEAN_VER}_linux_amd64.deb\` / \`arm64.deb\` |
          | **RedHat / Fedora** | **RPM Package** | \`angler_${CLEAN_VER}_linux_amd64.rpm\` / \`arm64.rpm\` |
          | **macOS Binaries** | Tarball | \`angler_${CLEAN_VER}_darwin_arm64.tar.gz\` / \`amd64.tar.gz\` |
          | **Linux Binaries** | Tarball | \`angler_${CLEAN_VER}_linux_arm64.tar.gz\` / \`amd64.tar.gz\` |
          | **Windows Binaries** | Zip Archive | \`angler_${CLEAN_VER}_windows_amd64.zip\` / \`arm64.zip\` |
          | **Checksums** | SHA-256 | \`checksums.txt\` |

          ### 🚀 How to Install or Upgrade

          #### macOS & Linux (Homebrew)
          \`\`\`bash
          brew update
          brew upgrade angler
          # Or fresh install:
          brew install Lake-of-Tears/tap/angler
          \`\`\`

          #### Windows (Scoop)
          \`\`\`powershell
          scoop bucket add lake-of-tears https://github.com/Lake-of-Tears/scoop-bucket
          scoop install angler
          \`\`\`

          #### Debian / Ubuntu (.deb)
          \`\`\`bash
          curl -sLO "https://github.com/Lake-of-Tears/angler/releases/download/${TARGET_TAG}/angler_${CLEAN_VER}_linux_amd64.deb"
          sudo dpkg -i angler_${CLEAN_VER}_linux_amd64.deb
          \`\`\`

          #### RedHat / Fedora (.rpm)
          \`\`\`bash
          sudo rpm -i "https://github.com/Lake-of-Tears/angler/releases/download/${TARGET_TAG}/angler_${CLEAN_VER}_linux_amd64.rpm"
          \`\`\`
          EOF

  chocolatey:
    name: "Stage 3: Chocolatey Package & Publish"
    needs: [inspect, publish]
    runs-on: windows-latest
    if: ${{ secrets.CHOCOLATEY_API_KEY != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.inspect.outputs.target_tag }}

      - name: Download Windows Release Archive & Extract Checksum
        shell: bash
        run: |
          TARGET_TAG="${{ needs.inspect.outputs.target_tag }}"
          CLEAN_VER="${TARGET_TAG#v}"

          # Fetch checksums.txt from newly published release
          curl -sSL "https://github.com/Lake-of-Tears/angler/releases/download/${TARGET_TAG}/checksums.txt" -o checksums.txt
          SHA256_64=$(grep "angler_${CLEAN_VER}_windows_amd64.zip" checksums.txt | awk '{print $1}')

          echo "sha256_64=$SHA256_64" >> "$GITHUB_ENV"
          echo "clean_ver=$CLEAN_VER" >> "$GITHUB_ENV"

      - name: Generate Chocolatey Manifests
        shell: pwsh
        run: |
          $ver = $env:clean_ver
          $tag = "${{ needs.inspect.outputs.target_tag }}"
          $sha64 = $env:sha256_64

          New-Item -ItemType Directory -Force -Path "choco\tools" | Out-Null

          # Generate nuspec
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>angler</id>
              <version>$ver</version>
              <title>Angler CLI (Lake of Tears)</title>
              <authors>Lake of Tears Team</authors>
              <projectUrl>https://thelakeoftears.com</projectUrl>
              <licenseUrl>https://github.com/Lake-of-Tears/angler/blob/main/LICENSE</licenseUrl>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <description>The official CLI for Lake of Tears — cast queries, launch clusters, inspect catalogs, and reel in data.</description>
              <summary>Lake of Tears CLI: query DuckDB over S3, manage clusters, and execute AI queries.</summary>
              <tags>lake-of-tears angler datalakehouse duckdb s3 cli</tags>
              <packageSourceUrl>https://github.com/Lake-of-Tears/angler</packageSourceUrl>
            </metadata>
            <files>
              <file src="tools\**" target="tools" />
            </files>
          </package>
          "@ | Set-Content -Path "choco\angler.nuspec"

          # Generate chocolateyinstall.ps1
          @"
          `$ErrorActionPreference = 'Stop'
          `$toolsDir = "`$(Split-Path -parent `$MyInvocation.MyCommand.Definition)"
          `$url64 = "https://github.com/Lake-of-Tears/angler/releases/download/$tag/angler_${ver}_windows_amd64.zip"

          `$packageArgs = @{
            packageName   = 'angler'
            unzipLocation = `$toolsDir
            url64bit      = `$url64
            checksum64    = '$sha64'
            checksumType64= 'sha256'
          }

          Install-ChocolateyZipPackage @packageArgs
          "@ | Set-Content -Path "choco\tools\chocolateyinstall.ps1"

      - name: Pack and Push to Chocolatey
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          Set-Location choco
          choco pack angler.nuspec
          choco push "angler.$($env:clean_ver).nupkg" --api-key $env:CHOCOLATEY_API_KEY --source https://push.chocolatey.org/
